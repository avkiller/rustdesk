
name: Nightly Build Rustdesk for fireworld

on:
  #schedule:
    # schedule build every night
    # - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'release tags(Default:1.5.1)'
        required: true
        default: '1.5.1'
      skip-publish:
        description: '跳过自动发布（稍后手动执行）'
        type: boolean
        default: false

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/fireworld-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "${{ inputs.version }}"
      publish-release: ${{ !inputs.skip-publish }}
